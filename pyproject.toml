[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "methylgpt"
version = "0.2.0"
description = "MethylGPT: a foundation model for the DNA methylome"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9,<3.12"
authors = [
    {name = "Kejun Albert Ying"},
    {name = "Jinyeop Song"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0,<2.5",
    "torchtext>=0.15,<0.19",
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<2.3",
    "scipy>=1.10,<1.14",
    "scikit-learn>=1.2,<1.7",
    "lightning>=2.0,<2.5",
    "tqdm>=4.65",
    "datasets>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
tutorials = [
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter",
    "aquarel",
    "lifelines>=0.27",
]
flash-attn = [
    "flash-attn>=2.0",
]
all = [
    "methylgpt[dev,tutorials]",
]

[project.urls]
Homepage = "https://github.com/albert-ying/MethylGPT"
Repository = "https://github.com/albert-ying/MethylGPT"
Issues = "https://github.com/albert-ying/MethylGPT/issues"

[tool.setuptools.packages.find]
include = ["methylgpt*"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["methylgpt/modules/scGPT/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"methylgpt/__init__.py" = ["E402", "F401"]
"methylgpt/finetuning/__init__.py" = ["F401"]
"methylgpt/finetuning/finetuning_metrics.py" = ["F841"]
"methylgpt/utils/__init__.py" = ["F403"]
"methylgpt/utils/plot_embeddings.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "integration: marks tests as integration tests requiring external resources",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
