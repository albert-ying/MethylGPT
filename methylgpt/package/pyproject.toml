[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "methylgpt"
version = "1.1.2"
description = "MethylGPT: pretrained model of human DNA methylation for imputation, age, clock and representation tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "torch>=2.0"]

[project.optional-dependencies]
examples = ["jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
