name: methylgpt
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python>=3.9,<3.12
  - pip>=23.0

  # PyTorch ecosystem (CUDA 12.1)
  - pytorch>=2.0,<2.5
  - pytorch-cuda=12.1
  - torchtext>=0.15,<0.19

  # Scientific computing
  - numpy>=1.24,<2.0
  - pandas>=2.0,<2.3
  - scipy>=1.10,<1.14
  - scikit-learn>=1.2,<1.7
  - tqdm>=4.65

  # Deep learning
  - lightning>=2.0,<2.5

  # Pip-only packages
  - pip:
    - datasets>=2.14.0
    - methylgpt

    # Optional: tutorials
    # - umap-learn>=0.5.5
    # - matplotlib>=3.7.0
    # - seaborn>=0.12.0
    # - jupyter
    # - aquarel>=0.0.6
